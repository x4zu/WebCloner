name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template:
    name: Template check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/webclone/template
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/webclone/template/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  scaffold:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate plugin manifests
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          for d in skills/*/; do test -f "$d/SKILL.md" || { echo "missing $d/SKILL.md"; exit 1; }; done
      - name: Scripts parse and print usage
        run: |
          for f in skills/webclone/scripts/*.mjs skills/webclone/scripts/lib/*.mjs; do node --check "$f"; done
          for f in recon-site asset-harvest motion-probe interaction-probe route-crawl network-capture visual-diff fidelity-gate audit-clone brand-kit; do
            node "skills/webclone/scripts/$f.mjs" --help > /dev/null
          done
      - name: Scaffold a project
        run: |
          mkdir -p /tmp/wc && cd /tmp/wc
          node "$GITHUB_WORKSPACE/skills/webclone/scripts/scaffold.mjs" example.com --install > out.json
          cat out.json
          test -f example-com-clone/.webclone.json
          test -d example-com-clone/src/components/sites/example-com
      - name: Scaffolded project builds
        working-directory: /tmp/wc/example-com-clone
        run: npm run check
      - name: Recon and gate with the system browser (no Playwright)
        working-directory: /tmp/wc/example-com-clone
        run: |
          S="$GITHUB_WORKSPACE/skills/webclone/scripts"
          node "$S/recon-site.mjs" --url https://example.com --out docs/research/example-com/recon --label original --widths 1440,390
          node "$S/asset-harvest.mjs" --url https://example.com --recon docs/research/example-com/recon/original-recon.json --out public/sites/example-com --manifest docs/research/example-com/recon/asset-manifest.json
          node "$S/motion-probe.mjs" --url https://example.com --out docs/research/example-com/recon/motion --positions 0,1
          R=docs/research/example-com/recon/screenshots
          node "$S/visual-diff.mjs" --original $R/original-1440.png --clone $R/original-1440.png --out /tmp/vd.json --min-fidelity 99
          node "$S/fidelity-gate.mjs" --origin https://example.com --local https://example.com --routes / --widths 1440 --out /tmp/gate
          set +e
          node "$S/audit-clone.mjs" --project . --recon docs/research/example-com/recon/original-recon.json --strict --out /tmp/CLONE_AUDIT.md
          code=$?
          set -e
          # The untouched template must fail the strict gate (palette not copied yet).
          test "$code" = "2"
